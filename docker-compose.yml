services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: webevent
      POSTGRES_PASSWORD: webevent
      POSTGRES_DB: webevent
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webevent -d webevent"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
