name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  WEBEVENT_TEST_DATABASE_URL: postgres://webevent:webevent@localhost:5432/postgres?sslmode=disable

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15
          args: --build-tags e2e

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: webevent
          POSTGRES_PASSWORD: webevent
          POSTGRES_DB: webevent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U webevent"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify go.mod is tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: Vet
        run: go vet ./... && go vet -tags e2e ./test/...
      - name: Unit and integration tests (race detector, coverage)
        run: go test -race -count=1 -coverpkg=./internal/...,./pkg/... -coverprofile=coverage.out ./...
      - name: Enforce coverage >= 75%
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t < 75) }'
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  e2e:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: webevent
          POSTGRES_PASSWORD: webevent
          POSTGRES_DB: webevent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U webevent"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: End-to-end tests (real binary, crashes, rolling restart)
        run: go test -race -count=1 -tags e2e -timeout 15m ./test/e2e/...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fuzz (short smoke run of every target)
        run: |
          go test -run XXX -fuzz FuzzVerifyNeverPanics -fuzztime 20s ./pkg/webhook
          go test -run XXX -fuzz FuzzValidateEndpointURL -fuzztime 20s ./internal/api
          go test -run XXX -fuzz FuzzNormalizeEventTypes -fuzztime 20s ./internal/api
          go test -run XXX -fuzz FuzzIdempotencyKey -fuzztime 20s ./internal/api

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
