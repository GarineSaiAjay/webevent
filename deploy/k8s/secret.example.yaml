# Copy to secret.yaml, fill in real values, and NEVER commit the copy.
# Better: create it with your secret manager (External Secrets, Sealed Secrets, Vault).
apiVersion: v1
kind: Secret
metadata:
  name: webevent
  namespace: webevent
type: Opaque
stringData:
  WEBEVENT_DATABASE_URL: postgres://webevent:CHANGE_ME@postgres.example.internal:5432/webevent?sslmode=require
  WEBEVENT_API_KEYS: CHANGE_ME_openssl_rand_hex_32
  WEBEVENT_SECRET_KEY: CHANGE_ME_openssl_rand_base64_32
