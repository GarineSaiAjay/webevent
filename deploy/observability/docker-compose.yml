# Local observability stack: Prometheus (metrics + alerts), Jaeger (traces)
# and Grafana. Start it next to a server running on your machine:
#
#   docker compose -f deploy/observability/docker-compose.yml up -d
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 make run
#
# Prometheus: http://localhost:9091   Jaeger: http://localhost:16686
# Grafana:    http://localhost:3000 (anonymous admin)
services:
  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.listen-address=:9091
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9091:9091"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  jaeger:
    image: jaegertracing/all-in-one:1.58
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
      - "4318:4318" # OTLP over HTTP

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    ports: ["3000:3000"]
